<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:">
<title>Tana2D Setup</title>
<style>
:root{
  --ink:#f4f6fb; --ink-2:rgba(236,240,250,.74); --ink-3:rgba(236,240,250,.52);
  --glass:rgba(13,16,28,.86); --glass-line:rgba(255,255,255,.14);
  --accent:#4b8bff; --accent-2:#7aa8ff; --good:#3ddc97; --warn:#ffbd5c;
  --night:#070a14; --r:22px;
  --ease:cubic-bezier(.2,.8,.2,1);
  color-scheme:dark;
}
@media (prefers-contrast:more){ :root{ --glass:rgba(8,10,18,.94); --ink-2:#fff; --ink-3:#e6e6e6; --glass-line:#fff; } }
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--night);color:var(--ink);
  font:15px/1.5 -apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",sans-serif;-webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent-2);outline-offset:3px;border-radius:12px}

/* ---------- full-bleed scenes ---------- */
#stage{position:fixed;inset:0;overflow:hidden}
.scene{position:absolute;inset:0;opacity:0;transition:opacity .7s var(--ease),transform .9s var(--ease);transform:scale(1.03)}
.scene.on{opacity:1;transform:none}
.sky{position:absolute;inset:-10%;background:
  radial-gradient(60% 50% at var(--ax,20%) var(--ay,15%),hsla(var(--h1,222),90%,58%,.55),transparent 70%),
  radial-gradient(55% 45% at var(--bx,85%) var(--by,25%),hsla(var(--h2,280),85%,60%,.42),transparent 70%),
  radial-gradient(70% 60% at 60% 110%,hsla(var(--h3,190),90%,45%,.45),transparent 70%),
  linear-gradient(180deg,#0b1024,#070a14 70%);
  animation:drift 26s ease-in-out infinite alternate}
@keyframes drift{to{transform:translate3d(-3%,2%,0) scale(1.06)}}
.grain{position:absolute;inset:0;opacity:.08;mix-blend-mode:overlay;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
.art{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:70px 48px 180px 48px}
.art.right{justify-content:center;padding:64px 40px 40px 480px}
.art>*{flex:none;transform-origin:center}

/* ---------- top bar ---------- */
#progress{position:fixed;top:16px;left:50%;transform:translateX(-50%);display:flex;gap:8px;z-index:5;transition:opacity .4s}
#progress i{width:7px;height:7px;border-radius:9px;background:rgba(255,255,255,.22);transition:all .5s var(--ease)}
#progress i.done{background:rgba(255,255,255,.62)}
#progress i.now{width:26px;background:#fff}
#preview{position:fixed;top:12px;right:16px;z-index:6;font-size:12px;padding:4px 10px;border-radius:99px;background:rgba(255,189,92,.18);color:var(--warn);border:1px solid rgba(255,189,92,.35);display:none}

/* ---------- glass panel ---------- */
#panel{position:fixed;left:32px;bottom:32px;width:min(420px,calc(100vw - 64px));z-index:4;
  background:var(--glass);border:1px solid var(--glass-line);border-radius:var(--r);
  backdrop-filter:blur(28px) saturate(170%);-webkit-backdrop-filter:blur(28px) saturate(170%);
  box-shadow:0 30px 80px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.08);padding:26px 26px 22px;
  transition:transform .55s var(--ease),opacity .4s var(--ease)}
#panel.out{transform:translateY(14px);opacity:0}
#panel.wide{width:min(560px,calc(100vw - 64px))}
#panel.center{left:50%;transform:translateX(-50%)}
#panel.center.out{transform:translate(-50%,14px)}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);margin-bottom:8px;display:flex;gap:8px;align-items:center}
h1{font-size:27px;line-height:1.15;letter-spacing:-.02em;margin:0 0 10px;font-weight:700;outline:none}
.body{color:var(--ink-2);margin:0}
.body b{color:var(--ink);font-weight:600}
.extra{margin-top:14px}
.actions{display:flex;gap:10px;margin-top:22px;align-items:center}
.btn{appearance:none;border:0;border-radius:13px;height:46px;padding:0 22px;font-weight:600;font-size:15px;cursor:pointer;
  transition:transform .15s,background .2s,box-shadow .2s,opacity .2s;display:inline-flex;align-items:center;gap:9px;white-space:nowrap}
.btn:active{transform:scale(.97)}
.btn.primary{background:linear-gradient(180deg,#5b96ff,#3a74f0);color:#fff;box-shadow:0 8px 24px rgba(58,116,240,.45),inset 0 1px 0 rgba(255,255,255,.25);flex:1;justify-content:center}
.btn.primary:hover{box-shadow:0 10px 30px rgba(58,116,240,.6),inset 0 1px 0 rgba(255,255,255,.3)}
.btn.secondary{background:rgba(255,255,255,.1);color:var(--ink)}
.btn.secondary:hover{background:rgba(255,255,255,.16)}
.btn[disabled]{opacity:.5;cursor:default;box-shadow:none}
.btn.pulse{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 8px 34px rgba(91,150,255,.95),0 0 0 6px rgba(91,150,255,.18)}}
.spinner{width:16px;height:16px;border-radius:50%;border:2px solid rgba(255,255,255,.35);border-top-color:#fff;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.note{margin-top:14px;padding:10px 12px;border-radius:12px;background:rgba(255,189,92,.12);border:1px solid rgba(255,189,92,.28);color:#ffe2b5;font-size:13.5px}
.note.good{background:rgba(61,220,151,.12);border-color:rgba(61,220,151,.3);color:#c6f6df}
.wait{display:flex;align-items:center;gap:10px;color:var(--ink-3);font-size:13px;margin-top:18px}
.wait .dot{width:8px;height:8px;border-radius:50%;background:var(--accent-2);animation:breathe 1.6s ease-in-out infinite}
@keyframes breathe{50%{opacity:.25;transform:scale(.7)}}
.link{background:none;border:0;padding:0;color:var(--ink-3);text-decoration:underline;text-underline-offset:3px;cursor:pointer;font-size:13px}
.link:hover{color:var(--ink)}
kbd{font:600 12.5px -apple-system,sans-serif;display:inline-flex;align-items:center;justify-content:center;min-width:24px;height:24px;padding:0 7px;border-radius:7px;
  background:linear-gradient(180deg,rgba(255,255,255,.2),rgba(255,255,255,.1));border:1px solid rgba(255,255,255,.2);border-bottom-width:2px;color:#fff;margin:0 1px}
.cmd{font:600 15px/1.45 ui-monospace,"SF Mono",Menlo,monospace;background:rgba(0,0,0,.42);border:1px solid rgba(255,255,255,.16);border-radius:12px;padding:12px 14px;
  color:#b6ffd8;user-select:text;-webkit-user-select:text;word-spacing:.18em;letter-spacing:.01em}
.steps{margin:0;padding:0;list-style:none;counter-reset:s}
.steps li{counter-increment:s;display:flex;gap:10px;align-items:flex-start;color:var(--ink-2);font-size:13.5px;margin:7px 0}
.steps li::before{content:counter(s);flex:none;width:21px;height:21px;border-radius:50%;background:rgba(255,255,255,.14);color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;margin-top:1px}
.steps code{font:600 12px ui-monospace,Menlo,monospace;color:#b6ffd8;user-select:text;-webkit-user-select:text}
.check{display:inline-flex;width:20px;height:20px;border-radius:50%;background:var(--good);color:#04110a;align-items:center;justify-content:center;font-size:12px;font-weight:800}

/* ---------- choice cards (style step) ---------- */
.choices{position:fixed;inset:0;display:flex;gap:26px;align-items:center;justify-content:center;padding:60px 40px 210px;z-index:3}
.choice{appearance:none;cursor:pointer;width:250px;height:260px;border-radius:26px;border:1px solid var(--glass-line);background:var(--glass);
  backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:22px;gap:6px;
  transition:transform .3s var(--ease),border-color .3s,box-shadow .3s;color:var(--ink)}
.choice:hover,.choice:focus-visible{transform:translateY(-6px);border-color:rgba(122,168,255,.8);box-shadow:0 24px 60px rgba(58,116,240,.35)}
.choice svg{flex:1;width:100%}
.choice strong{font-size:17px}
.choice span{font-size:13px;color:var(--ink-3)}

/* ---------- settings rows (opened from the menu) ---------- */
.rows{margin-top:14px;border-radius:14px;background:rgba(255,255,255,.06);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid rgba(255,255,255,.07)}
.row:first-child{border-top:0}
.row div{flex:1}
.row small{display:block;color:var(--ink-3);font-size:12.5px}
.switch{appearance:none;width:42px;height:25px;border-radius:99px;background:rgba(255,255,255,.2);position:relative;cursor:pointer;border:0;transition:background .25s;flex:none}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:21px;height:21px;border-radius:50%;background:#fff;transition:transform .25s var(--ease);box-shadow:0 1px 3px rgba(0,0,0,.4)}
.switch[aria-checked=true]{background:var(--good)}
.switch[aria-checked=true]::after{transform:translateX(17px)}
.mini{appearance:none;border:0;border-radius:9px;padding:6px 12px;background:rgba(255,255,255,.12);cursor:pointer;font-size:13px;font-weight:600}
.mini:hover{background:rgba(255,255,255,.2)}

/* ---------- mock macOS chrome used in illustrations ---------- */
.mac{background:rgba(30,32,40,.92);border:1px solid rgba(255,255,255,.12);border-radius:14px;box-shadow:0 40px 90px rgba(0,0,0,.55),0 0 0 .5px rgba(0,0,0,.6);overflow:hidden;color:#e9ebf2;font-size:13px}
.mac .bar{height:34px;display:flex;align-items:center;gap:8px;padding:0 13px;background:rgba(255,255,255,.04);border-bottom:1px solid rgba(255,255,255,.07)}
.lights{display:flex;gap:7px}.lights i{width:11px;height:11px;border-radius:50%;background:#ff5f57}.lights i:nth-child(2){background:#febc2e}.lights i:nth-child(3){background:#28c840}
.mac .title{flex:1;text-align:center;font-weight:600;color:#c9cbd6;margin-right:44px}
.set{display:flex;height:100%}
.set aside{width:170px;padding:12px 8px;background:rgba(255,255,255,.03);border-right:1px solid rgba(255,255,255,.06)}
.set aside p{margin:2px 0;padding:5px 9px;border-radius:7px;display:flex;align-items:center;gap:8px;color:#c3c6d2}
.set aside p.sel{background:#3a6fe8;color:#fff}
.set aside i{width:18px;height:18px;border-radius:5px;display:inline-block;flex:none}
.set main{flex:1;padding:16px 20px}
.set h4{margin:0 0 12px;font-size:15px}
.card{background:rgba(255,255,255,.05);border-radius:10px;border:1px solid rgba(255,255,255,.06)}
.item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-top:1px solid rgba(255,255,255,.06)}
.item:first-child{border-top:0}
.item .ico{width:24px;height:24px;border-radius:6px;flex:none}
.item span{flex:1}
.tog{width:34px;height:20px;border-radius:20px;background:rgba(255,255,255,.18);position:relative;flex:none}
.tog::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.4)}
.tog.on{background:#2fbf71}.tog.on::after{left:16px}
.tog.flip{animation:togbg 4.2s infinite}.tog.flip::after{animation:togknob 4.2s infinite}
@keyframes togbg{0%,52%{background:rgba(255,255,255,.18)}58%,100%{background:#2fbf71}}
@keyframes togknob{0%,52%{left:2px}58%,100%{left:16px}}
.hl{box-shadow:0 0 0 2px rgba(122,168,255,.9),0 0 0 7px rgba(122,168,255,.18);border-radius:8px;animation:hl 2.4s ease-in-out infinite}
@keyframes hl{50%{box-shadow:0 0 0 2px rgba(122,168,255,.5),0 0 0 12px rgba(122,168,255,.06)}}
.cursor{position:absolute;width:22px;height:22px;pointer-events:none;filter:drop-shadow(0 2px 3px rgba(0,0,0,.5))}
.app-icon{width:76px;height:76px;border-radius:19px;background:linear-gradient(145deg,#6aa5ff,#3557e0 55%,#7b3fe4);position:relative;box-shadow:0 14px 34px rgba(54,92,230,.55),inset 0 1px 0 rgba(255,255,255,.4)}
.app-icon::before,.app-icon::after{content:"";position:absolute;border-radius:5px;background:rgba(255,255,255,.92)}
.app-icon::before{left:20%;top:26%;width:35%;height:29%}
.app-icon::after{left:60%;top:26%;width:20%;height:48%;background:rgba(255,255,255,.55)}
.app-icon i{position:absolute;left:20%;top:60%;width:35%;height:14%;border-radius:4px;background:rgba(255,255,255,.55)}
.app-icon::before,.app-icon::after,.app-icon i{border-radius:12%}

/* ---------- Tana plane simulation ---------- */
.plane{position:absolute;inset:0;overflow:hidden;cursor:grab;touch-action:none}
.plane.dragging{cursor:grabbing}
.plane .world{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
.win{position:absolute;border-radius:12px;background:#1b1e27;border:1px solid rgba(255,255,255,.1);box-shadow:0 22px 50px rgba(0,0,0,.5);overflow:hidden;transition:box-shadow .2s}
.win.focus{box-shadow:0 0 0 3px #4b8bff,0 22px 60px rgba(40,90,220,.45)}
.win .bar{height:28px;display:flex;align-items:center;padding:0 11px;gap:6px;background:rgba(255,255,255,.05);border-bottom:1px solid rgba(255,255,255,.06)}
.win .bar .lights i{width:10px;height:10px}
.win .bar b{flex:1;text-align:center;font-size:12px;color:#aeb2c0;font-weight:600;margin-right:40px}
.win .content{position:absolute;inset:28px 0 0 0;padding:14px}
.plane-hint{position:absolute;top:58px;left:50%;transform:translateX(-50%);display:flex;gap:10px;align-items:center;padding:9px 16px;border-radius:99px;background:rgba(10,14,26,.72);
  border:1px solid var(--glass-line);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);font-size:13.5px;color:var(--ink-2);white-space:nowrap;z-index:2;transition:all .4s var(--ease)}
.plane-hint.done{border-color:rgba(61,220,151,.6);color:#c6f6df}
.zoom-badge{position:absolute;right:20px;bottom:20px;font:600 12px ui-monospace,Menlo,monospace;color:var(--ink-3);background:rgba(10,14,26,.6);padding:4px 9px;border-radius:8px;z-index:2}

@media (prefers-reduced-motion:reduce){ *,*::before,*::after{animation-duration:.001s!important;animation-iteration-count:1!important;transition-duration:.001s!important} }
@media (max-width:820px){ .art.right{padding-left:48px;justify-content:center;padding-bottom:300px} }

/* ---------- print: the Recovery steps on one sheet ---------- */
#print{display:none}
@media print{
  html,body{overflow:visible;background:#fff;color:#000;height:auto}
  #stage,#panel,#progress,#preview,.choices{display:none!important}
  #print{display:block;font:14pt/1.5 -apple-system,sans-serif;padding:24pt}
  #print code{font:600 13pt Menlo,monospace;background:#eee;padding:2pt 5pt}
}
</style>
</head>
<body>
<div id="stage" aria-hidden="true"></div>
<div id="progress" aria-hidden="true"></div>
<div id="preview">Preview — buttons do nothing</div>
<section id="panel" role="main" aria-labelledby="title">
  <div class="eyebrow" id="eyebrow"></div>
  <h1 id="title" tabindex="-1"></h1>
  <p class="body" id="body"></p>
  <div class="extra" id="extra"></div>
  <div id="msg" role="status" aria-live="polite"></div>
  <div class="actions" id="actions"></div>
</section>
<div id="print"></div>

<script>
"use strict";
/* ======================================================================
   Bridge. Native code owns every check and every privileged action; this
   page only presents them. Opened in a browser, it runs on mock state.
   ====================================================================== */
const native = window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.tana;
const send = (action, value) => native ? native.postMessage({action, value}) : mock.act(action, value);
const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
const $ = id => document.getElementById(id);
const h = (strings, ...values) => strings.reduce((out, s, i) => out + s + (i < values.length ? values[i] : ""), "");
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

let st = null;            // latest state from native
let screen = null;        // current screen id
let plan = [];            // progress groups for the dots
let shownFor = null;      // requirement the current screen addresses
let advancing = false;

/* ======================================================================
   Illustrations. Every scene is a full-window picture; the panel sits on top.
   ====================================================================== */
const cursorSVG = `<svg viewBox="0 0 24 24"><path d="M5 2l14 11.5-6.3.6 3.8 7.4-2.7 1.4-3.8-7.5L5 20z" fill="#fff" stroke="#000" stroke-width="1.2" stroke-linejoin="round"/></svg>`;
function sky(h1, h2, h3, extra = "") {
  return `<div class="sky" style="--h1:${h1};--h2:${h2};--h3:${h3};${extra}"></div><div class="grain"></div>`;
}
function settingsWindow(title, side, sel, main, w = 560, ht = 360) {
  const colors = ["#8e8e93","#0a84ff","#5e5ce6","#30d158","#ff9f0a","#ff375f","#64d2ff","#bf5af2"];
  return `<div class="mac" style="width:${w}px;height:${ht}px"><div class="bar"><div class="lights"><i></i><i></i><i></i></div><div class="title">${title}</div></div>
    <div class="set" style="height:calc(100% - 34px)"><aside>${side.map((s, i) => `<p class="${i === sel ? "sel" : ""}"><i style="background:${colors[i % colors.length]}"></i>${s}</p>`).join("")}</aside><main>${main}</main></div></div>`;
}
const scenes = {
  welcome: () => sky(222, 268, 190) + `<div class="plane" id="heroPlane"></div>`,
  move: () => sky(205, 160, 230) + `<div class="art right"><div style="position:relative;width:440px;height:300px">
      <div class="mac" style="position:absolute;inset:0"><div class="bar"><div class="lights"><i></i><i></i><i></i></div><div class="title">Applications</div></div>
        <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:18px;padding:26px">
          ${["#ff9f0a","#30d158","#0a84ff","#bf5af2","#ff375f","#64d2ff","#8e8e93"].map(c => `<div style="display:flex;flex-direction:column;align-items:center;gap:6px;opacity:.55"><div style="width:48px;height:48px;border-radius:12px;background:${c}"></div><div style="width:44px;height:6px;border-radius:3px;background:rgba(255,255,255,.2)"></div></div>`).join("")}
          <div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:52px;height:52px;border-radius:13px;border:2px dashed rgba(122,168,255,.8);animation:hl 2s infinite"></div></div>
        </div></div>
      <div id="flyIcon" style="position:absolute;left:-150px;top:120px;animation:fly 3.4s var(--ease) infinite"><div class="app-icon" style="transform:scale(.7)"><i></i></div></div>
    </div></div>
    <style>@keyframes fly{0%,12%{transform:translate(0,0) scale(1);opacity:0}20%{opacity:1}62%,80%{transform:translate(497px,30px) scale(.72);opacity:1}100%{transform:translate(497px,30px) scale(.72);opacity:0}}</style>`,
  accessibility: () => sky(215, 290, 180) + `<div class="art right"><div style="position:relative">
      ${settingsWindow("Accessibility", ["Wi‑Fi","Bluetooth","Notifications","General","Appearance","Privacy & Security","Desktop & Dock","Displays"], 5,
        `<h4>‹ &nbsp;Accessibility</h4><p style="margin:-6px 0 12px;color:#9a9db0;font-size:12px">Allow the apps below to control your computer.</p>
         <div class="card"><div class="item"><div class="ico" style="background:#8e8e93"></div><span>Calendar Helper</span><div class="tog on"></div></div>
         <div class="item hl"><div class="app-icon" style="width:24px;height:24px;border-radius:6px;box-shadow:none"></div><span><b>Tana2D</b></span><div class="tog flip"></div></div>
         <div class="item"><div class="ico" style="background:#30d158"></div><span>Screen Reader Tools</span><div class="tog"></div></div></div>`)}
      <div class="cursor" style="animation:clickTog 4.2s var(--ease) infinite">${cursorSVG}</div></div></div>
    <style>@keyframes clickTog{0%{left:200px;top:330px}45%,60%{left:525px;top:177px}50%{transform:scale(.85)}55%{transform:none}100%{left:525px;top:177px}}</style>`,
  recoveryWhy: () => sky(250, 300, 205) + `<div class="art right">${shieldArt()}</div>`,
  rec1: () => sky(230, 260, 200) + `<div class="art right">${laptopArt(arch() === "arm64")}</div>`,
  rec2: () => sky(235, 255, 210) + `<div class="art right"><div class="mac" style="width:470px;height:300px;background:#05060a;border-color:rgba(255,255,255,.08)">
      <div style="height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px">
        <div style="color:#c9cbd6;font-size:13px">Continue holding for startup options…</div>

  if (id === "tour3" && changed && plane && !plane.isOverview()) plane.flyTo(plane.overviewCam(), 900);
  if (id === "recReady") $("print").innerHTML = `<h1>Tana2D: Recovery steps</h1><ol>${recSteps().map(r => `<li><b>${r.title}</b><br>${r.body}${r.typed ? `<p><code>${r.typed}</code></p>` : ""}</li>`).join("")}</ol><p>Afterwards, Tana2D opens by itself to finish setup.</p>`;
}
function drawChoices(on) {
  document.querySelectorAll(".choices").forEach(c => c.remove());
  if (!on) return;
  const wrap = document.createElement("div"); wrap.className = "choices";
  wrap.innerHTML = `
    <button class="choice" data-style="trackpad"><svg viewBox="0 0 200 130"><rect x="30" y="18" width="140" height="94" rx="14" fill="rgba(255,255,255,.1)" stroke="rgba(255,255,255,.3)"/>
      ${[0,1,2].map(i => `<circle cx="${82 + i*18}" cy="64" r="7" fill="#7aa8ff"><animate attributeName="cx" values="${82+i*18};${102+i*18};${82+i*18}" dur="2.2s" repeatCount="indefinite"/></circle>`).join("")}</svg>
      <strong>Trackpad</strong><span>Swipe and pinch, hover to focus</span></button>
    <button class="choice" data-style="keyboard"><svg viewBox="0 0 200 130"><rect x="18" y="30" width="164" height="72" rx="10" fill="rgba(255,255,255,.1)" stroke="rgba(255,255,255,.3)"/>
      ${Array.from({length:3},(_,r)=>Array.from({length:9},(_,c)=>`<rect x="${28+c*17}" y="${40+r*17}" width="13" height="12" rx="3" fill="rgba(255,255,255,${(r===2&&c>2&&c<6)?".55":".22"})"/>`).join("")).join("")}</svg>
      <strong>Keyboard</strong><span>Shortcuts, less motion, works with VoiceOver</span></button>`;
  wrap.querySelectorAll(".choice").forEach(b => b.onclick = () => { style = b.dataset.style; send("style", style); go("login"); });
  document.body.appendChild(wrap);
}
function mountScenePlane(scene) {
  if (scene === "welcome") mountPlane("heroPlane", {interactive: false, scale: .62}, p => p.autoplay());
  else if (scene === "tour") mountPlane("tourPlane", {onEvent: tourEvent});
  else if (scene === "done") mountPlane("donePlane", {interactive: false}, p => p.flyTo(p.overviewCam(), 1600));
  else if (scene === "settings") mountPlane("setPlane", {interactive: false, scale: .62}, p => p.autoplay());
  else if (plane) { plane.destroy(); plane = null; }
}
function tourEvent(kind, amount) {
  if (kind === "pan") { panTotal += amount; if (panTotal > 500 && !tourDone.pan) { tourDone.pan = true; celebrate("tour1", "Nice. That's how you move."); } }
  if (kind === "overview" && !tourDone.overview) { tourDone.overview = true; celebrate("tour2", "That's your whole workspace."); }
  if (kind === "jump" && !tourDone.jump) { tourDone.jump = true; celebrate("tour3", "Straight in. You've got it."); }
}
function celebrate(forScreen, text) {
  if (screen !== forScreen) return;
  show(screen, {soft: true});
  const hint = document.createElement("div"); hint.className = "plane-hint done"; hint.innerHTML = `<span class="check">✓</span>${esc(text)}`;
  const sc = document.querySelector("#stage .scene:last-child"); if (sc) { sc.querySelectorAll(".plane-hint").forEach(x => x.remove()); sc.appendChild(hint); }
}
const TOUR_GOAL = {tour1:"pan", tour2:"overview", tour3:"jump"};
function placeHint(id) {
  const sc = document.querySelector("#stage .scene:last-child"); if (!sc) return;
  sc.querySelectorAll(".plane-hint").forEach(x => x.remove());
  if (tourDone[TOUR_GOAL[id]]) return;
  const text = {tour1: style === "keyboard" ? "Try <kbd>⌥</kbd><kbd>⌘</kbd><kbd>→</kbd>, or drag" : "Scroll or drag to move",
    tour2: "Pinch, or press <kbd>⌃</kbd><kbd>↩</kbd>", tour3: "Click any window"}[id];
  const hint = document.createElement("div"); hint.className = "plane-hint"; hint.innerHTML = text; sc.appendChild(hint);
}
let typeTimer = null;
function typeOut(text) {
  clearTimeout(typeTimer);
  const run = () => {
    const el = document.getElementById("typed"), after = document.getElementById("typedAfter"); if (!el) return;
    if (reduceMotion) { el.textContent = text; after.style.opacity = 1; return; }
    let i = 0; el.textContent = ""; after.style.opacity = 0;
    const tick = () => { if (!document.getElementById("typed")) return; el.textContent = text.slice(0, ++i);
      if (i < text.length) typeTimer = setTimeout(tick, 45 + Math.random() * 60); else { after.style.opacity = 1; typeTimer = setTimeout(run, 4200); } };
    typeTimer = setTimeout(tick, 700);
  };
  setTimeout(run, 50);
}

/* Native state arrives once a second, and immediately after any action. */
window.tanaUpdate = next => {
  const first = !st; const prevMissing = st ? st.missing.join() : ""; st = next;
  document.getElementById("preview").style.display = st.preview ? "block" : "none";
  if (first) { show(st.startup ? "welcome" : (st.canStart ? "settings" : "welcome")); return; }
  /* A requirement the current screen addresses is now satisfied: confirm, then move on. */
  if (shownFor && !st.missing.includes(shownFor) && !advancing) {
    advancing = true; const doneFor = shownFor;
    $("eyebrow").innerHTML = `<span class="check">✓</span> Done`; $("actions").innerHTML = ""; $("msg").innerHTML = "";
    setTimeout(() => { advancing = false; if (shownFor === doneFor) go(nextScreen()); }, reduceMotion ? 300 : 1100);
    return;
  }
  if (advancing) return;
  /* A requirement that regressed while later screens were open sends the person back to it. */
  const inReq = shownFor || /^(rec|recoveryWhy|recReady)$/.test(screen);
  if (!inReq && prevMissing !== st.missing.join() && st.step !== "ready" && /^(style|login|tour\d)$/.test(screen)) { buildPlan(); go(nextScreen()); return; }
  show(screen, {soft: true});
};
window.tanaReset = () => { plan = []; screen = null; currentScene = null; tourDone = {pan:false, overview:false, jump:false}; panTotal = 0; if (st) show(st.startup ? "welcome" : "settings"); };

/* Return activates the main button; Escape goes back. */
addEventListener("keydown", e => {
  if (screen && screen.startsWith("tour") && plane) {
    if (e.ctrlKey && (e.key === "Enter" || e.key === "ArrowUp")) { e.preventDefault(); plane.toggleOverview(); return; }
    if (e.altKey && e.metaKey && e.key.startsWith("Arrow")) {
      e.preventDefault(); const a = APPS[plane.focus], cx = a.x + a.w / 2, cy = a.y + a.h / 2;
      const dir = {ArrowLeft:[-1,0], ArrowRight:[1,0], ArrowUp:[0,-1], ArrowDown:[0,1]}[e.key];
      let best = -1, bestD = Infinity;
      APPS.forEach((b, i) => { if (i === plane.focus) return; const dx = b.x + b.w / 2 - cx, dy = b.y + b.h / 2 - cy, along = dx * dir[0] + dy * dir[1];
        if (along <= 0) return; const d = along + Math.abs(dx * dir[1] + dy * dir[0]) * 2; if (d < bestD) { bestD = d; best = i; } });
      if (best >= 0) { plane.focusWin(best); tourEvent("pan", 600); }
      return;
    }
  }
  if (e.key === "Enter" && !e.ctrlKey && !(document.activeElement && document.activeElement.tagName === "BUTTON")) {
    const p = document.querySelector("#actions .btn.primary"); if (p && !p.disabled) { e.preventDefault(); p.click(); }
  }
  if (e.key === "Escape") { const s = [...document.querySelectorAll("#actions .btn.secondary")].find(b => /Back/.test(b.textContent)); if (s) s.click(); }
});
/* ======================================================================
   Mock state, so the page can be opened and reviewed in any browser.
   ?mock=fresh | intel | ready | settings | preview
   ====================================================================== */
const mock = {
  s: null,
  init() {
    const kind = new URLSearchParams(location.search).get("mock") || "fresh";
    const base = {accessibility:false, security:false, backend:false, sip:false, arm64e:false, bootArgsPending:false, inApplications:false, helperInstalled:false,
      sessionUnlocked:true, separateSpaces:true, otherManagerPID:0, normalDesktop:true, singleDisplay:true, startup:true, preview:false, busy:false, message:"",
      arch:"arm64", otherManager:"", loginEnabled:false, loginNeedsApproval:false, resumed:false, completed:false, keyboardMode:false, version:"0.6.5"};
    if (kind === "intel") base.arch = "x86_64";
    if (kind === "ready" || kind === "settings") Object.assign(base, {accessibility:true, security:true, backend:true, sip:true, arm64e:true, inApplications:true, helperInstalled:true});
    if (kind === "settings") base.startup = false;
    if (kind === "preview") base.preview = true;
    this.s = base; this.push();
  },
  missing(s) {
    const m = [];
    if (!s.inApplications) m.push("move"); if (!s.accessibility) m.push("accessibility");
    if (!s.backend) { if (!s.sip) m.push("recovery"); if (!s.arm64e) m.push(s.bootArgsPending ? "restart" : "bootArgs"); m.push("helper"); }
    if (!s.separateSpaces) m.push("spaces"); if (s.otherManagerPID) m.push("otherManager"); if (!s.singleDisplay) m.push("display");
    if (!s.normalDesktop) m.push("fullscreen"); return m;
  },
  push() { const s = this.s; s.missing = this.missing(s); s.step = s.missing[0] || "ready"; s.canStart = !s.missing.filter(x => x !== "move").length; window.tanaUpdate(JSON.parse(JSON.stringify(s))); },
  act(a, v) {
    const s = this.s, later = (fn, ms = 1500) => setTimeout(() => { fn(); this.push(); }, ms);
    if (s.preview) { s.message = "Preview only. This button does nothing here."; return this.push(); }
    if (a === "move") later(() => s.inApplications = true, 600);
    if (a === "accessibility") later(() => s.accessibility = true, 2500);
    if (a === "shutDownForRecovery") later(() => { s.sip = true; s.resumed = true; if (s.arch !== "arm64") s.arm64e = true; }, 1200);
    if (a === "enableBootArgs") { s.busy = true; this.push(); later(() => { s.busy = false; s.bootArgsPending = true; }); }
    if (a === "restart") later(() => { s.arm64e = true; s.bootArgsPending = false; s.security = true; });
    if (a === "installHelper") { s.busy = true; this.push(); later(() => { s.busy = false; s.helperInstalled = true; s.backend = true; }); }
    if (a === "login") { s.loginEnabled = !!v; this.push(); }
    if (a === "style") { s.keyboardMode = v === "keyboard"; this.push(); }
    if (a === "start") { s.completed = true; document.body.style.transition = "opacity .6s"; document.body.style.opacity = 0; }
    if (a === "print") window.print();
  },
};
if (native) send("ready"); else addEventListener("DOMContentLoaded", () => mock.init());
